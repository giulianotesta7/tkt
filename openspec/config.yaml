# openspec/config.yaml
schema: spec-driven

context: |
  Project: tkt — Go web application (server-side rendered).
  Tech stack: Go 1.25.14; backend with net/http; frontend via html/template with HTMX (SSR, no JS framework); JavaScript limited to user/workflow interactions (drag reorder, menu Escape handling); SQLite storage via modernc.org/sqlite (pure Go, CGO_ENABLED=0); multi-stage Docker build into a Distroless static image running as non-root (UID 65532).
  Architecture: layered — domain, application, adapters/http, adapters/sqlite.
  Testing: Go stdlib testing; suites in domain, application, adapters/http, and adapters/sqlite; SQL migrations; golden files for rendered HTML; Playwright MCP used locally for visual validation, with no versioned Playwright suite.
  Style: gofmt formatting, go vet clean. CI runs staticcheck@v0.7.0 (static analysis) and govulncheck@v1.7.0 (vulnerability detection) on PRs, pushes to main, weekly schedule, and manual dispatch.

strict_tdd: true

testing:
  runner: go test
  test_command: "go test ./..."
  build_command: "go build ./..."
  coverage_command: "go test -cover ./..."
  coverage_threshold: 75
  layers:
    unit: stdlib testing
    integration: net/http/httptest + in-memory SQLite
    e2e: Playwright MCP local visual validation only; no versioned Playwright suite
  quality:
    formatter: gofmt
    linter: go vet + staticcheck@v0.7.0
    type_checker: go vet (compile-time type checking)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - SQLite store persists through modernc.org/sqlite; builds stay CGO_ENABLED=0 for the Distroless static image
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Write tests before implementation (TDD)
    - Run "go test ./..." after each work unit
  verify:
    - Run "go test ./..." for verification
    - Run "go build ./..." for build verification
  archive:
    - Warn before merging destructive deltas