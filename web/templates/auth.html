<!DOCTYPE html>
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}{{tf "base.title" (brandName .Brand) (brandHelpDesk .Brand)}}{{end}}</title>
{{template "styles" .}}
</head>
<body>
<main class="auth-entry">
  <div>
    {{if .Brand.HasLogo}}<img class="auth-entry__logo" src="/brand/logo?v={{.Brand.LogoVersion}}" alt="" width="34" height="34">{{else}}<span class="auth-entry__logo">{{.Brand.Monogram}}</span>{{end}}
    <h1 class="command-title">{{brandName .Brand}}</h1>
    <p class="help">{{brandHelpDesk .Brand}}</p>
  </div>
  <section class="auth-entry__form-panel">
{{template "content" .}}
  </section>
{{if .Brand.SupportEmail}}  <footer class="help"><a href="mailto:{{.Brand.SupportEmail}}">{{.Brand.SupportEmail}}</a></footer>
{{end}}</main>
</body>
</html>
