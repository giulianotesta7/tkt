{{define "category_form"}}
<form class="card form-card" method="post" action="{{if .CategoryID}}/categories/{{.CategoryID}}/edit{{else}}/categories{{end}}">
  <h3>{{if .CategoryID}}Rename category{{else}}New category{{end}}</h3>
  {{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{.Name}}" required autofocus>
  </div>
  <button class="btn primary" type="submit">{{if .CategoryID}}Save changes{{else}}Create category{{end}}</button>
</form>
{{end}}
