{{define "sla_target_grid"}}<div class="sla-grid">
  <div class="sla-grid-row sla-grid-head" aria-hidden="true">
    <span class="sla-grid-priority"></span>
    <span class="sla-grid-milestone">{{t "sla.grid.first_response"}}</span>
    <span class="sla-grid-milestone">{{t "sla.grid.resolve"}}</span>
  </div>
{{range .Rows}}
  <div class="sla-grid-row">
    <span class="sla-grid-priority">{{priorityLabel .Priority}}{{if .Diverges}}<span class="sla-diverges">{{t "sla.grid.diverges"}}</span>{{end}}</span>
    <div class="sla-target">
      <span class="sla-unit"><span class="sla-unit-mark" aria-hidden="true">h</span><input type="number" inputmode="numeric" min="0" name="first_response_h_{{.Priority}}" value="{{.FirstResponse.Hours}}" aria-label="{{tf "sla.grid.first_response_hours" (priorityLabel .Priority)}}"></span>
      <span class="sla-unit"><span class="sla-unit-mark" aria-hidden="true">m</span><input type="number" inputmode="numeric" min="0" max="59" name="first_response_m_{{.Priority}}" value="{{.FirstResponse.Minutes}}" aria-label="{{tf "sla.grid.first_response_minutes" (priorityLabel .Priority)}}"></span>
      <span class="sla-unit"><span class="sla-unit-mark" aria-hidden="true">s</span><input type="number" inputmode="numeric" min="0" max="59" name="first_response_s_{{.Priority}}" value="{{.FirstResponse.Seconds}}" aria-label="{{tf "sla.grid.first_response_seconds" (priorityLabel .Priority)}}"></span>
    </div>
    <div class="sla-target">
      <span class="sla-unit"><span class="sla-unit-mark" aria-hidden="true">h</span><input type="number" inputmode="numeric" min="0" name="resolve_h_{{.Priority}}" value="{{.Resolve.Hours}}" aria-label="{{tf "sla.grid.resolve_hours" (priorityLabel .Priority)}}"></span>
      <span class="sla-unit"><span class="sla-unit-mark" aria-hidden="true">m</span><input type="number" inputmode="numeric" min="0" max="59" name="resolve_m_{{.Priority}}" value="{{.Resolve.Minutes}}" aria-label="{{tf "sla.grid.resolve_minutes" (priorityLabel .Priority)}}"></span>
      <span class="sla-unit"><span class="sla-unit-mark" aria-hidden="true">s</span><input type="number" inputmode="numeric" min="0" max="59" name="resolve_s_{{.Priority}}" value="{{.Resolve.Seconds}}" aria-label="{{tf "sla.grid.resolve_seconds" (priorityLabel .Priority)}}"></span>
    </div>
  </div>
{{end}}
</div>{{end}}
