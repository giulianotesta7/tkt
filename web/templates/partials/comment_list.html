{{define "comment_list"}}
<div id="comment-list">
  {{range .View.Comments}}
  <div class="comment">
    <div class="who">
      <span class="author">{{.Author}}</span>
      <span class="when">{{formatTime .CreatedAt}}</span>
    </div>
    <div class="body">{{.Body}}</div>
  </div>
  {{else}}
  <p class="empty">No comments yet.</p>
  {{end}}
</div>
{{end}}
