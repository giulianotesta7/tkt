{{define "ticket_form"}}
<form class="card form-card" method="post" action="/tickets">
  <h2>Ticket details</h2>
{{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
{{if .Selected}}
  <div class="selected-catalog-path">
    <span class="selected-catalog-label">Category</span>
    <strong>{{.Selected.DepartmentName}} / {{.Selected.AreaName}} / {{.Selected.Name}}</strong>
    <a href="/tickets/new">Change category</a>
  </div>
  <input type="hidden" name="category_id" value="{{.Selected.ID}}">
{{else}}
  <div class="field">
    <label for="category_id">Category</label>
    <select id="category_id" name="category_id" required>
      <option value="">Select category</option>
      {{range .Options.Categories}}<option value="{{.ID}}"{{if eq (.ID | printf "%d") $.Values.CategoryID}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </div>
{{end}}
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{.Values.Title}}" required autofocus>
  </div>
  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" name="description">{{.Values.Description}}</textarea>
  </div>
  <div class="field">
    <label for="priority">Priority</label>
    <select id="priority" name="priority">
      {{range .Options.Priorities}}<option value="{{.}}" {{if eq . $.Values.Priority}}selected{{end}}>{{humanize .}}</option>{{end}}
    </select>
  </div>
  <button class="btn primary" type="submit">Create ticket</button>
</form>
{{end}}
