{{define "user_form"}}
<form class="card form-card" method="post" action="{{if .UserID}}/users/{{.UserID}}/edit{{else}}/users{{end}}">
  <h3>{{if .UserID}}Operator details{{else}}New operator{{end}}</h3>
  {{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{.Values.Name}}" required autofocus>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Values.Email}}" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="password">{{if .UserID}}New password (leave blank to keep){{else}}Password{{end}}</label>
    <input type="password" id="password" name="password" {{if not .UserID}}required{{end}} autocomplete="new-password">
  </div>
  {{if .UserID}}
  <div class="field">
    <label><input type="checkbox" name="active" {{if .Values.Active}}checked{{end}}> Active</label>
    <p class="footnote">Unchecking deactivates the operator — their sessions are killed and they can no longer log in.</p>
  </div>
  {{end}}
  <button class="btn primary" type="submit">{{if .UserID}}Save changes{{else}}Create user{{end}}</button>
</form>
{{end}}
