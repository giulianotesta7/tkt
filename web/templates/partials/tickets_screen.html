{{define "tickets_screen"}}<section id="tickets-screen" class="page-foundation tickets-screen">
  <header class="page-header">
    <div>
      <h1 class="page-title">Tickets</h1>
      <p class="page-subtitle">{{.Total}} ticket{{if ne .Total 1}}s{{end}}</p>
    </div>
    <div class="page-actions">
      <a class="page-action page-action-primary" href="/tickets/new">New ticket</a>
    </div>
  </header>{{template "filter_form" .}}{{template "ticket_list" .}}
</section>{{end}}
