{{define "pagination"}}
<div class="pagination">
  <span>Page {{.Page}} of {{.Pages}} · {{.Total}} tickets</span>
  <div class="pages">
    {{if .PrevHref}}<a href="{{.PrevHref}}" hx-get="{{.PrevHref}}" hx-target="#ticket-list" hx-swap="outerHTML" hx-indicator="#ticket-list">← Prev</a>{{else}}<span class="page" aria-disabled="true">← Prev</span>{{end}}
    {{if .NextHref}}<a href="{{.NextHref}}" hx-get="{{.NextHref}}" hx-target="#ticket-list" hx-swap="outerHTML" hx-indicator="#ticket-list">Next →</a>{{else}}<span class="page" aria-disabled="true">Next →</span>{{end}}
    <span class="htmx-indicator spinner" aria-hidden="true"></span>
  </div>
</div>
{{end}}
