{{define "title"}}{{tf "base.title.screen" (t "base.nav.categories")}}{{end}}
{{define "content"}}
<div class="users-root categories-root">{{template "categories_background" .}}<div id="category-drawer-host">{{if .Drawer}}{{template "category_drawer" .Drawer}}{{end}}</div>
<dialog id="category-delete-dialog" aria-labelledby="category-delete-title" aria-describedby="category-delete-copy">
  <h2 id="category-delete-title"></h2>
  <p id="category-delete-copy">{{t "categories.delete_confirm.body"}}</p>
  <div><button type="button" data-category-delete-cancel>{{t "common.cancel"}}</button><button type="button" data-category-delete-confirm>{{t "categories.delete_confirm.confirm"}}</button></div>
</dialog>
</div>
{{end}}
