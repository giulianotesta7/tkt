{{define "content"}}
<div class="command-header">
  <div><h1 class="command-title">Groups</h1><p class="command-sub">Agent-plus teams for future routing</p></div>
</div>
{{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
<form class="card form-card" method="post" action="/groups">
  <h2>New group</h2><div class="field"><label for="name">Name</label><input id="name" name="name" required></div><button class="btn primary" type="submit">Create group</button>
</form>
<div class="category-grid">
{{range .Groups}}
  <div class="category-card"><div><div class="name">{{.Name}}</div><div class="when">{{len .Members}} members</div>
  <ul>{{range .Members}}<li>{{.Name}} <form method="post" action="/groups/{{.GroupID}}/members/{{.ID}}/delete"><button class="btn ghost small" type="submit">Remove</button></form></li>{{end}}</ul></div>
  <div class="row-actions"><form method="post" action="/groups/{{.ID}}/edit"><input name="name" value="{{.Name}}" required><button class="btn ghost small" type="submit">Rename</button></form><form method="post" action="/groups/{{.ID}}/delete"><button class="btn danger small" type="submit">Delete</button></form></div>
  <form method="post" action="/groups/{{.ID}}/members"><select name="user_id">{{range $.Eligible}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select><button class="btn ghost small" type="submit">Add member</button></form></div>
{{else}}<div class="empty">No groups yet.</div>{{end}}
</div>
{{end}}
