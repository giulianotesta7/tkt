{{define "title"}}{{tf "base.title.screen" (t "settings.title") (brandHelpDesk .Brand)}}{{end}}
{{define "content"}}
<div class="command-header">
  <div>
    <h1 class="command-title">{{t "settings.title"}}</h1>
  </div>
</div>
<div class="settings-layout">
{{template "settings_nav" .}}
  <div class="settings-content">
{{if .Error}}    <div class="error-banner" role="alert">{{.Error}}</div>
{{end}}    <form class="settings-form card form-card" method="post" action="/settings/language" data-settings-form>
      <h2 class="settings-section-title">{{t "settings.language.title"}}</h2>
      <div class="field">
        <label for="interface_language">{{t "settings.language.label"}}</label>
        <select id="interface_language" name="interface_language">
{{range .Languages}}      <option value="{{.Value}}"{{if eq $.CurrentLanguage .Value}} selected{{end}}>{{t .Label}}</option>
{{end}}    </select>
      </div>
      <div class="settings-savebar" data-settings-savebar hidden>
        <button class="btn primary" type="submit">{{t "settings.language.save"}}</button>
        <button class="btn" type="reset">{{t "settings.discard"}}</button>
      </div>
    </form>
  </div>
</div>
{{end}}
