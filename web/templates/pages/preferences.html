{{define "title"}}{{tf "base.title.screen" (t "preferences.title")}}{{end}}
{{define "content"}}
<div class="command-header">
  <div>
    <h1 class="command-title">{{t "preferences.title"}}</h1>
    <p class="command-sub">{{t "preferences.subtitle"}}</p>
  </div>
</div>
{{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
<form class="card form-card" method="post" action="/preferences">
  <h2>{{t "preferences.queue.title"}}</h2>
  <p class="help">{{t "preferences.queue.help"}}</p>
  <div class="field">
    <label for="queue_order">{{t "preferences.queue.default"}}</label>
    <select id="queue_order" name="queue_order">
{{range .Orders}}      <option value="{{.Value}}"{{if eq $.Current .Value}} selected{{end}}>{{t .Label}}</option>
{{end}}    </select>
  </div>
  <button class="btn primary" type="submit">{{t "preferences.save"}}</button>
</form>
{{end}}
