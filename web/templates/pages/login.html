{{define "content"}}
<form class="login-form" method="post" action="/login" novalidate>
  <h2>Sign in to tkt</h2>
  <p class="lead">Use your work email and password.</p>
  {{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" autocomplete="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
  </div>
  <button class="btn primary" type="submit">Sign in</button>
</form>
{{end}}
