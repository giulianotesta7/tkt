{{define "content"}}
<form class="login-form" method="post" action="/login" novalidate>
  <h2>{{t "auth.login.title"}}</h2>
{{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
  <div class="field">
    <label for="email">{{t "common.email"}}</label>
    <input type="email" id="email" name="email" value="{{.Email}}" placeholder="{{t "auth.email_placeholder"}}" autocomplete="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">{{t "common.password"}}</label>
    <input type="password" id="password" name="password" placeholder="{{t "auth.password_placeholder"}}" autocomplete="current-password" required>
  </div>
  <button class="btn primary" type="submit">{{t "auth.login.submit"}}</button>
</form>
{{end}}
