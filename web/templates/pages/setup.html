{{define "content"}}
<form class="login-form" method="post" action="/setup" novalidate>
  <h2>Create your account</h2>
  <p class="lead">No users exist yet. The first account is an active regular operator — bootstrap happens only once.</p>
  {{if .Error}}<div class="error-banner" role="alert">{{.Error}}</div>{{end}}
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{.Name}}" placeholder="Ana Torres" autocomplete="name" required autofocus>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
  </div>
  <button class="btn primary" type="submit">Create account</button>
  <p class="footnote">Passwords are stored as bcrypt hashes only.</p>
</form>
{{end}}
