services:
  tkt:
    build: .
    ports:
      - "8080:8080"
    environment:
      TKT_DB_PATH: /data/tkt.db
      TKT_LISTEN: :8080
    volumes:
      - tkt-data:/data
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  tkt-data:
