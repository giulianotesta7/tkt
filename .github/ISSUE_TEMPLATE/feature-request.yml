name: Feature request
description: Suggest a new capability or improvement for TKT
title: "[Feature]: "
labels: ["type:feature"]
assignees: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TKT. Describe the problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the current limitation, who it affects, and the use case it prevents or complicates.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the desired observable behavior and the conditions that would make the request complete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workaround or alternative approach you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or other relevant information.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find an equivalent request.
          required: true
