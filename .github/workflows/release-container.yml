# Publishes the tkt container image to GHCR when a vX.Y.Z tag is pushed.
# The tag push is the trigger by design (issue #208): there is no rolling
# publish from main, and workflow_dispatch is deliberately absent.
#
# The registry login uses the built-in `docker login` with the workflow token
# and the push uses `docker push` — no docker/* marketplace action, matching
# the repository's actions/checkout-only third-party policy.
name: Release container

# The tag filter is deliberately broad, and the step below is the single
# authority on the tag shape. Filter patterns are glob-shaped rather than
# regular expressions, so the tag grammar cannot be expressed in a filter: the
# no-leading-zeros rule needs alternation, which glob has none of. More
# importantly, a filter that matches nothing fails silently, and for a release
# workflow that is the worst outcome: nothing happens and nobody notices.
# "v*.*.*" cannot miss a vX.Y.Z tag, and a malformed tag then fails loudly in
# the validation step instead of going unnoticed. One residual, stated on
# purpose: a tag without the leading "v" does not trigger this workflow at all,
# because the repository's tag convention is vX.Y.Z.
on:
  push:
    tags:
      - "v*.*.*"

# packages:write is what lets GITHUB_TOKEN push to ghcr.io; nothing else is
# granted beyond read-only repository contents.
permissions:
  contents: read
  packages: write

# Releases are serialized. The group is deliberately static rather than per-ref
# like the other workflows: two different tags must never run concurrently,
# because both would push the mutable minor and latest tags. cancel-in-progress
# is false, because a release must never be cancelled mid-push.
concurrency:
  group: release-container
  cancel-in-progress: false

env:
  # Unique resources per run: run_id guarantees isolation; run_attempt
  # distinguishes retries of the same run (same convention as container.yml).
  VOLUME_NAME: tkt-release-data-${{ github.run_id }}-${{ github.run_attempt }}
  CONTAINER_NAME: tkt-release-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  publish:
    name: build, smoke test, push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Derive and validate the version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Leading zeros are rejected too: v01.2.3 is not the shape a human
          # reads off a release, and publishing it would invent a second
          # spelling of the same version.
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "FAIL: tag '$VERSION' does not have the expected shape vX.Y.Z with no leading zeros (for example v1.2.3); refusing to publish"
            exit 1
          fi
          # The floating minor tag keeps the first two components: v1.2.3 -> v1.2
          MINOR="${VERSION%.*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MINOR=$MINOR" >> "$GITHUB_ENV"

      - name: Compute the image reference
        shell: bash
        run: |
          set -euo pipefail
          # Derived from the repository and lowercased — never hardcoded, so the
          # alignment check in internal/container can re-derive it from go.mod.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # The build args feed the OCI org.opencontainers.image.version and
          # .revision labels; without them the labels stay at their dev defaults.
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$MINOR" \
            --tag "$IMAGE:latest" \
            --file Dockerfile \
            .

      # Smoke test, login, push and manifest verification share one step so the
      # EXIT trap can remove exactly the container, the volume and the images
      # this run created — after a successful push the local tags are redundant;
      # on any failure nothing is pushed unless the smoke test already passed.
      - name: Smoke test, then publish
        shell: bash
        run: |
          set -euo pipefail
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("",0)); print(s.getsockname()[1]); s.close()')

          docker volume create "${{ env.VOLUME_NAME }}"

              # The trap cleans up only the exact resources owned by this run, and it
              # prints the diagnostics before removing them: every smoke assertion below
              # exits through this trap, so evidence collected after the cleanup does not
              # exist. A successful run sets RELEASE_OK and stays quiet.
              cleanup() {
                echo ""
                if [ -z "${RELEASE_OK:-}" ]; then
                  echo "=== Diagnostics ==="
                  docker logs "${{ env.CONTAINER_NAME }}" 2>/dev/null || echo "(no container logs)"
                  docker inspect "${{ env.CONTAINER_NAME }}" 2>/dev/null || echo "(no container to inspect)"
                fi
                  echo "=== Cleanup ==="
                  docker stop "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
                  docker rm "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
                  docker volume rm "${{ env.VOLUME_NAME }}" 2>/dev/null || true
                  docker rmi "$IMAGE:$VERSION" "$IMAGE:$MINOR" "$IMAGE:latest" 2>/dev/null || true
                  echo "Cleanup done."
              }
          trap cleanup EXIT

          # --- Smoke test the built image (no --env overrides: the image must
          # --- prove its own defaults). Nothing below this point may run if the
          # --- smoke test fails.
          echo "=== Starting container ==="
          docker run \
            --name "${{ env.CONTAINER_NAME }}" \
            --volume "${{ env.VOLUME_NAME }}:/data" \
            --publish "127.0.0.1:$PORT:8080" \
            --detach \
            "$IMAGE:$VERSION"

          echo "=== Waiting for /healthz ==="
          HEALTH_URL="http://127.0.0.1:$PORT/healthz"
          success=false
          for i in $(seq 1 15); do
            if curl -sf "$HEALTH_URL" >/dev/null 2>&1; then
              echo "Healthz OK (attempt $i)"
              success=true
              break
            fi
            echo "Waiting… attempt $i"
            sleep 1
          done
          if [ "$success" = false ]; then
            echo "FAIL: /healthz never responded"
            docker logs "${{ env.CONTAINER_NAME }}"
            exit 1
          fi

          echo "=== Binary healthcheck ==="
          if docker exec "${{ env.CONTAINER_NAME }}" /server -healthcheck; then
            echo "Binary healthcheck: OK"
          else
            echo "FAIL: binary healthcheck failed"
            docker logs "${{ env.CONTAINER_NAME }}"
            exit 1
          fi

          echo "=== Non-root identity ==="
          user=$(docker inspect "${{ env.CONTAINER_NAME }}" --format '{{.Config.User}}')
          if [ "${user%%:*}" != "65532" ]; then
            echo "FAIL: container runs as '$user' (expected UID 65532)"
            exit 1
          fi
          echo "OK: container runs as '$user'"

          echo "=== Database file ownership in the volume ==="
          dbuid=$(docker run --rm \
            --volume "${{ env.VOLUME_NAME }}:/data" \
            busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 \
            stat -c %u /data/tkt.db)
          if [ "$dbuid" != "65532" ]; then
            echo "FAIL: /data/tkt.db is owned by UID '$dbuid' (expected 65532)"
            exit 1
          fi
          echo "OK: /data/tkt.db is owned by UID $dbuid"

          # --- Log in and push (built-in docker login with the workflow token —
          # --- no marketplace action).
          echo "=== Logging in to ghcr.io ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

          echo "=== Pushing the three tags ==="
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$MINOR"
          docker push "$IMAGE:latest"

          # --- Prove the manifest resolves before declaring success.
          if ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "FAIL: the manifest for $IMAGE:$VERSION does not resolve on ghcr.io"
            exit 1
          fi
          echo "Manifest for $IMAGE:$VERSION resolves."
          echo ""
          echo "=== Published tags ==="
          echo "  $IMAGE:$VERSION"
          echo "  $IMAGE:$MINOR"
          echo "  $IMAGE:latest"
          # Reached only when everything above succeeded: it silences the
          # diagnostics in the cleanup trap on success.
          RELEASE_OK=1
