name: OpenSpec

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenSpec / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate canonical specs
        run: |
          OUTPUT=$(OPENSPEC_TELEMETRY=0 npx --yes --package=@fission-ai/openspec@1.11.0 -- \
            openspec validate --all --strict --no-interactive 2>&1)
          echo "$OUTPUT"
          # Fail if the CLI reports it could not parse or ignored openspec/config.yaml
          if echo "$OUTPUT" | grep -qiE "could not parse|ignoring it"; then
            echo "ERROR: OpenSpec CLI reported a parse failure. Check openspec/config.yaml indentation."
            exit 1
          fi

      - name: Validate archived changes
        run: |
          OUTPUT=$(OPENSPEC_TELEMETRY=0 npx --yes --package=@fission-ai/openspec@1.11.0 -- \
            openspec validate --archived --no-interactive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "could not parse|ignoring it"; then
            echo "ERROR: OpenSpec CLI reported a parse failure in archived changes."
            exit 1
          fi