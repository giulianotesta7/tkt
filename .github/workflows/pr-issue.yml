name: PR issue

on:
  # Run trusted base code only; PR content is event data, never executable code.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read

concurrency:
  group: pr-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-issue:
    name: PR issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/pr-issue.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const validate = require('./.github/scripts/pr-issue.cjs');
              await validate({ github, context });
            } catch (error) {
              core.setFailed(error.message);
            }
