name: Go quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  # The race tests dominate the run time, almost all of it in two packages
  # whose tests run serially. Those two each get a shard that compiles the
  # test binary once and fans its tests out over every core
  # (.github/scripts/race-fanout.sh); "rest" is computed from `go list` so a
  # new package always lands in a shard.
  race:
    name: Go race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [http, sqlite, rest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Select packages
        id: packages
        run: |
          module=$(go list -m)
          heavy="$module/internal/adapters/http $module/internal/adapters/sqlite"
          all=$(go list ./...)
          for pkg in $heavy; do
            echo "$all" | grep -qx "$pkg" || { echo "shard package $pkg no longer exists"; exit 1; }
          done
          case "${{ matrix.shard }}" in
            http) list="$module/internal/adapters/http" ;;
            sqlite) list="$module/internal/adapters/sqlite" ;;
            rest) list=$(echo "$all" | grep -vx -e "$module/internal/adapters/http" -e "$module/internal/adapters/sqlite" | tr '\n' ' ') ;;
          esac
          echo "Testing: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Test (race)
        run: |
          case "${{ matrix.shard }}" in
            rest) go test ${{ steps.packages.outputs.list }} -race -count=1 -timeout 20m ;;
            *) .github/scripts/race-fanout.sh ./internal/adapters/${{ matrix.shard }} "$(nproc)" ;;
          esac

  # The fan-out runs each test in one of several processes, so a test that
  # depends on another's leftover state, or a goroutine one test leaks into the
  # next, is only seen when both land in the same group. After every merge to
  # main, this job runs the whole suite in one serial process as before, to keep
  # that coverage without slowing pull requests.
  race-full:
    name: Go race (full, serial)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race, serial)
        run: go test ./... -race -count=1 -timeout 20m

  # Branch protection requires a check named "Go quality"; this job carries
  # that name and is red whenever the lint job or any race shard did not pass.
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, race]
    if: always()

    steps:
      - name: Require every Go job to pass
        run: |
          echo "lint=${{ needs.lint.result }} race=${{ needs.race.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.race.result }}" = "success" ]
